name: D23D48 Financeiro Tests

on:
  pull_request:
    paths:
      - 'app/financeiro/**'
      - 'tests/test_d23d48_conciliacao_repasse.py'
      - 'tests/etapa_a_obrigacoes_financeiras_unittest.py'
      - '.github/workflows/d23d48-tests.yml'
  workflow_dispatch:

jobs:
  test-financeiro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Teste D23D48
        run: python tests/test_d23d48_conciliacao_repasse.py

      - name: Regressao obrigacoes e repasse
        run: python tests/etapa_a_obrigacoes_financeiras_unittest.py
