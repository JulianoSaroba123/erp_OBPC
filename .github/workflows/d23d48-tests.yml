name: D23D48 + D23D52 Financeiro Tests

on:
  pull_request:
    paths:
      - 'app/financeiro/**'
      - 'app/static/css/obpc-*.css'
      - 'app/templates/login_base.html'
      - 'scripts/regularizar_d23d48_projeto_filipe.py'
      - 'tests/test_d23d48_conciliacao_repasse.py'
      - 'tests/test_d23d48_regularizacao_historica.py'
      - 'tests/etapa_a_obrigacoes_financeiras_unittest.py'
      - 'tests/test_d23d52_financeiro_canonical.py'
      - 'tests/test_d23d52_financeiro_padrao_membros.py'
      - 'tests/test_d23d52_global_theme.py'
      - 'tests/test_d23d52_template_syntax.py'
      - '.github/workflows/d23d48-tests.yml'
  workflow_dispatch:

jobs:
  d23d48-python311:
    name: D23D48 Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Teste D23D48 conciliacao
        run: python tests/test_d23d48_conciliacao_repasse.py

      - name: Teste D23D48 regularizacao historica
        run: python tests/test_d23d48_regularizacao_historica.py

      - name: Compilar script de regularizacao
        run: python -m py_compile scripts/regularizar_d23d48_projeto_filipe.py

  regressao-repasse-python312:
    name: Regressao Repasse + Visual Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Regressao obrigacoes e repasse
        run: python tests/etapa_a_obrigacoes_financeiras_unittest.py

      - name: D23D52 tema global
        run: python tests/test_d23d52_global_theme.py

      - name: D23D52 financeiro canonico
        run: python tests/test_d23d52_financeiro_canonical.py

      - name: D23D52 financeiro padrao membros
        run: python tests/test_d23d52_financeiro_padrao_membros.py

      - name: D23D52 sintaxe templates Jinja
        run: python tests/test_d23d52_template_syntax.py
